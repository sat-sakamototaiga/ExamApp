services:
  # PHPアプリケーションサービス
  app:
    build:
      context: . # Dockerfileの場所を指定 (現在のディレクトリ)
      dockerfile: Dockerfile # 使用するDockerfile名
    ports:
      - "8000:80" # ホストの8000番ポートをコンテナの80番ポートにマッピング
      - "5173:5173"
    volumes:
      - .:/var/www/html # 現在のディレクトリをコンテナのWebルートにマッピング
    depends_on:
      - db # dbサービスが起動してからappサービスを起動
    environment: # 環境変数の設定 (Laravelの.envファイルと連携)
      DB_CONNECTION: mysql
      DB_HOST: db # データベースサービスのホスト名 (dbサービス名と同じ)
      DB_PORT: 3306
      DB_DATABASE: laravel # データベース名 (任意で変更可能)
      DB_USERNAME: root # データベースユーザー名
      DB_PASSWORD: password # データベースパスワード

  # MySQLデータベースサービス
  db:
    image: mysql:8.0 # 使用するMySQLのバージョン
    ports:
      - "3306:3306" # ホストの3306番ポートをコンテナの3306番ポートにマッピング (任意)
    environment: # データベースの環境変数設定
      MYSQL_ROOT_PASSWORD: password # rootユーザーのパスワード
      MYSQL_DATABASE: laravel # 作成するデータベース名 (appサービスと合わせる)
    volumes:
      - db_data:/var/lib/mysql # データベースデータを永続化するためのボリューム

# データを永続化するためのボリューム定義
volumes:
  db_data: